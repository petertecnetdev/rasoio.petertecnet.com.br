name: Validate Rasoio

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasoio-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit production dependencies
        id: production_audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
          audit_exit=$?
          set -e
          echo "exit_code=${audit_exit}" >> "$GITHUB_OUTPUT"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rasoio-npm-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce production audit
        if: steps.production_audit.outputs.exit_code != '0'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          for (const [name, details] of Object.entries(vulnerabilities)) {
            if (details.severity === 'high' || details.severity === 'critical') {
              console.error(`::error title=npm audit ${details.severity}::${name} requires remediation before production deploy`);
            }
          }
          process.exit(1);
          NODE

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          CI: "true"
          REACT_APP_API_URL: https://api.petertecnet.com.br/api
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -s build/index.html
          test -d build/static/js
          test -d build/static/css
