name: Validate Rasoio

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-rasoio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Tests
        env:
          CI: "true"
        run: npm run test:ci

      - name: Production build
        env:
          CI: "true"
          REACT_APP_API_URL: https://api.petertecnet.com.br/api
        run: npm run build

      - name: Validate build artifact
        run: |
          test -f build/index.html
          test -d build/static
