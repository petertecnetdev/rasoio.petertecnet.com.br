name: Validate Rasoio

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasoio-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: rasoio-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:ci

      - name: Production build
        env:
          REACT_APP_API_URL: https://api.petertecnet.com.br/api
          REACT_APP_GOOGLE_CLIENT_ID: 404224718244-5tudlgk5q63fmtg2q816eso8c76nvel3.apps.googleusercontent.com
        run: npm run build
